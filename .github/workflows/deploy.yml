name: Deploy a Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'real-estate-web/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reusable CI: lint/typecheck/test/build deben pasar antes de desplegar.
  ci:
    uses: ./.github/workflows/ci.yml

  migrations-ready:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      # Read-only gate: this job never accesses Supabase or applies migrations.
      - name: Require successful production migrations
        uses: actions/github-script@v9
        with:
          script: |
            const { data: migrations } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              path: 'real-estate-web/supabase/migrations',
              per_page: 1,
            })
            if (!migrations[0]) {
              core.setFailed('Cannot determine the required migration commit; deployment blocked.')
              return
            }
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy-migrations.yml',
                branch: 'main',
                per_page: 1,
              })
              const run = data.workflow_runs[0]
              if (!run) {
                core.setFailed('No production migration run found. Run Deploy Migrations before deploying.')
                return
              }
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed('Production migrations failed. Fix Supabase credentials and rerun Deploy Migrations: ' + run.html_url)
                  return
                }
                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: migrations[0].sha + '...' + run.head_sha,
                })
                if (comparison.status === 'ahead' || comparison.status === 'identical') return
                core.setFailed('The successful migration run does not include this release migrations; deployment blocked.')
                return
              }
              await new Promise(resolve => setTimeout(resolve, 10000))
            }
            core.setFailed('Production migrations are still pending; frontend deployment blocked.')

  deploy:
    needs: migrations-ready
    runs-on: ubuntu-latest
    environment: env
    defaults:
      run:
        working-directory: real-estate-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: real-estate-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Deploy
        run: npm run deploy
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
